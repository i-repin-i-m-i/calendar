<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Жизнь в неделях</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #000000;
            --surface: #1C1C1E;
            --surface-elevated: #2C2C2E;
            --text-primary: #FFFFFF;
            --text-secondary: #8E8E93;
            --text-tertiary: #48484A;
            --accent: #007AFF;
        }
        html {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            -webkit-font-smoothing: antialiased;
        }
        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-bottom: 40px;
        }
        .container { width: 100%; max-width: 400px; }
        .header { text-align: center; margin-bottom: 32px; }
        .logo {
            width: 72px; height: 72px;
            margin: 0 auto 20px;
            background: var(--surface);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo svg { width: 40px; height: 40px; opacity: 0.9; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: var(--text-secondary); font-size: 16px; }
        
        .form-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .form-group { margin-bottom: 18px; }
        .form-group:last-of-type { margin-bottom: 0; }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        input, select {
            width: 100%;
            background: var(--surface-elevated);
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 17px;
            color: var(--text-primary);
            font-family: inherit;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        input:focus, select:focus {
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.3);
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.5;
        }
        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: '';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid var(--text-secondary);
            pointer-events: none;
        }
        select option {
            background: var(--surface-elevated);
            color: var(--text-primary);
        }
        button {
            width: 100%;
            background: var(--accent);
            border: none;
            border-radius: 14px;
            padding: 18px;
            font-size: 17px;
            font-weight: 600;
            color: white;
            font-family: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        button:active { opacity: 0.8; }
        
        .info {
            margin-top: 24px;
            text-align: center;
        }
        .info-hint {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--text-tertiary);
            font-size: 13px;
            margin-bottom: 12px;
        }
        .info-hint svg { width: 14px; height: 14px; opacity: 0.6; }
        .footer {
            color: var(--text-tertiary);
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 6v6l4 2"/>
                </svg>
            </div>
            <h1>Жизнь в неделях</h1>
            <p class="subtitle">Визуализация времени для обоев iPhone</p>
        </header>
        
        <form action="/generate" method="POST">
            <div class="form-card">
                <div class="form-group">
                    <label>Дата рождения</label>
                    <input type="date" name="birth_date" required>
                </div>
                
                <div class="form-group">
                    <label>Ожидаемый возраст</label>
                    <input type="number" name="life_expectancy" placeholder="80" min="1" max="120" value="80" required>
                </div>
                
                <div class="form-group">
                    <label>Модель iPhone</label>
                    <div class="select-wrapper">
                        <select name="model">
                            {% for key, device in models.items() %}
                            <option value="{{ key }}" {% if key == '17air' %}selected{% endif %}>
                                {{ device.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
            
            <button type="submit">Создать обои</button>
        </form>
        
        <div class="info">
            <div class="info-hint">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                Данные не сохраняются
            </div>
            <p class="footer">
                Каждый квадрат — одна неделя жизни<br>
                Чем светлее — тем ценнее время
            </p>
        </div>
    </div>
    
    <script>
        const today = new Date().toISOString().split('T')[0];
        document.querySelector('input[type="date"]').setAttribute('max', today);
    </script>
</body>
</html>
